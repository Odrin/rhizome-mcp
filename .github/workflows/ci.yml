name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      # -run '^TestIntegration' stops this step from re-running every unit test
      # the previous step just ran (the integration build tag only adds files,
      # so ./... alone would), the same way the coverage job filters.
      - name: Run integration tests
        run: go test -tags=integration -run '^TestIntegration' ./...

      - name: Stage binary for npm launcher tests
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="rhizome-mcp"
          [ "$RUNNER_OS" = "Windows" ] && BIN_NAME="rhizome-mcp.exe"
          go build -trimpath -o "$BIN_NAME" .

          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) PKG_DIR="linux-x64" ;;
            Linux/ARM64) PKG_DIR="linux-arm64" ;;
            macOS/X64) PKG_DIR="darwin-x64" ;;
            macOS/ARM64) PKG_DIR="darwin-arm64" ;;
            Windows/X64) PKG_DIR="win32-x64" ;;
            Windows/ARM64) PKG_DIR="win32-arm64" ;;
            *) echo "Unsupported runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac

          mkdir -p "packages/npm/$PKG_DIR/bin"
          cp "$BIN_NAME" "packages/npm/$PKG_DIR/bin/$BIN_NAME"
          chmod +x "packages/npm/$PKG_DIR/bin/$BIN_NAME" || true

      - name: Run npm launcher tests
        working-directory: packages/npm/rhizome-mcp
        run: node --test test/*.test.js

      # Seed corpora run everywhere as ordinary unit tests; the generative pass
      # costs wall-clock time, so it runs on Linux only with a short fixed
      # budget. A crash writes its input under testdata/, which then becomes a
      # permanent seed on every platform.
      - name: Fuzz untrusted-input parsers
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./internal/pagination/ -run='^$' -fuzz=FuzzCodecDecode -fuzztime=30s
          go test ./internal/normalization/ -run='^$' -fuzz=FuzzCanonicalizer -fuzztime=30s
          go test ./internal/domain/ -run='^$' -fuzz=FuzzParseLogicalProjectImportPlan -fuzztime=30s

  race-smoke:
    name: Race smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Keep race builds separate from the ordinary and coverage caches.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: Run critical concurrency tests with the race detector
        shell: bash
        run: |
          tests=(
            TestAttemptSimultaneousClaimsHaveOneWinner
            TestFinishAttemptConcurrentSameKeyReplay
            TestClaimIssueAcquiresReservationsAtomically
            TestClaimIssueReservationConflictAbortsClaimEntirely
            TestReservationsConcurrentAcquireHaveOneWinner
            TestReservationsAcquireAcrossProcesses
            TestWriteQueuedWritersLeaveReadConnectionsAvailable
            TestWriteCancellationWaitingForAdmission
            TestWriteQueuedWriterDoesNotDeadlockClose
            TestWriteRollbackAndRetryReleaseAdmission
            TestProjectRouterCoalescesConcurrentOpens
            TestProjectRouterReleaseIsIdempotentAndCloseDrains
            TestProjectRouterCancelingInitiatingWaiterReleasesReservation
            TestProjectRouterCancelingCoalescedWaiterLeavesHealthyWaiterWorking
            TestProjectRouterCloseWaitsForInitiatingLeaseRelease
            TestProjectRouterCloseTimeoutDoesNotConsumeCleanupCapability
            TestProjectRouterCloseWithCanceledContextClosesAdmissionImmediately
            TestProjectRouterConcurrentCloseCallsShareCleanup
            TestServeHTTPServerUsesEphemeralListenerAndShutdowns
            TestServeHTTPServerCancelsInFlightRequestContextOnShutdown
          )
          printf -v pattern '%s|' "${tests[@]}"
          go test -race -count=1 -v -run "^(${pattern%|})$" \
            ./internal/adapters/sqlite ./internal/compose ./internal/runtime \
            | tee race-smoke.log

          # A renamed or skipped test must not silently weaken this gate.
          for test in "${tests[@]}"; do
            if ! grep -Fq -- "--- PASS: $test (" race-smoke.log; then
              echo "::error::Race smoke test did not pass: $test" >&2
              exit 1
            fi
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate unit test coverage
        # Coverage profiles are output artifacts, so cached test results can
        # replay blocks instrumented against an older repository-wide source set.
        run: go test -count=1 ./... -covermode=atomic -coverpkg=./... -coverprofile=unit-coverage.out

      - name: Check unit test coverage
        id: unit-coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.unit.yml

      # The integration profile must measure the integration suite only, and
      # must include statements executed inside the real server subprocess.
      # -run '^TestIntegration' stops it from re-running every unit test (the
      # integration build tag only adds files, so ./... alone would), and
      # RHIZOME_INTEGRATION_COVERDIR makes the harness build a -cover
      # instrumented server that writes counters somewhere the merge step can
      # find them. It is deliberately not GOCOVERDIR: go test -coverprofile
      # overwrites GOCOVERDIR in the test process with a temporary build-cache
      # directory that is discarded when the run ends.
      # -count=1 also ensures cached tests cannot skip those subprocess writes.
      - name: Generate integration test coverage
        env:
          RHIZOME_INTEGRATION_COVERDIR: ${{ github.workspace }}/integration-covdata
        run: |
          mkdir -p "$RHIZOME_INTEGRATION_COVERDIR"
          go test -count=1 -tags=integration -run '^TestIntegration' ./... \
            -covermode=atomic -coverpkg=./... -coverprofile=integration-inprocess.out

      # Both halves are mode: atomic, so appending the subprocess profile
      # without its mode line yields one profile whose duplicate blocks the
      # cover parser sums.
      - name: Merge subprocess coverage into the integration profile
        env:
          RHIZOME_INTEGRATION_COVERDIR: ${{ github.workspace }}/integration-covdata
        run: |
          go tool covdata textfmt -i="$RHIZOME_INTEGRATION_COVERDIR" -o=integration-subprocess.out
          cp integration-inprocess.out integration-coverage.out
          tail -n +2 integration-subprocess.out >> integration-coverage.out

      - name: Check integration test coverage
        id: integration-coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.integration.yml

      - name: Publish coverage badge data
        if: github.ref_name == 'main'
        uses: actions/github-script@v9
        with:
          script: |
            const badges = [
              {
                path: '.badges/main/unit-coverage.json',
                label: 'unit coverage',
                message: '${{ steps.unit-coverage.outputs.total-coverage }}%',
                color: '${{ steps.unit-coverage.outputs.badge-color }}',
              },
              {
                path: '.badges/main/integration-coverage.json',
                label: 'integration coverage',
                message: '${{ steps.integration-coverage.outputs.total-coverage }}%',
                color: '${{ steps.integration-coverage.outputs.badge-color }}',
              },
            ];

            for (const badge of badges) {
              let sha;
              try {
                ({ data: { sha } } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: badge.path,
                  ref: 'main',
                }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: badge.path,
                message: `Update ${badge.label} badge`,
                content: Buffer.from(JSON.stringify({
                  schemaVersion: 1,
                  label: badge.label,
                  message: badge.message,
                  color: badge.color,
                })).toString('base64'),
                branch: 'main',
                sha,
              });
            }
