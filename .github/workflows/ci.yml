name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate unit test coverage
        run: go test ./... -covermode=atomic -coverpkg=./... -coverprofile=unit-coverage.out

      - name: Check unit test coverage
        id: unit-coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.unit.yml

      - name: Generate integration test coverage
        run: go test -tags=integration ./... -covermode=atomic -coverpkg=./... -coverprofile=integration-coverage.out

      - name: Check integration test coverage
        id: integration-coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.integration.yml

      - name: Publish coverage badge data
        if: github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const badges = [
              {
                path: '.badges/main/unit-coverage.json',
                label: 'unit coverage',
                message: '${{ steps.unit-coverage.outputs.total-coverage }}%',
                color: '${{ steps.unit-coverage.outputs.badge-color }}',
              },
              {
                path: '.badges/main/integration-coverage.json',
                label: 'integration coverage',
                message: '${{ steps.integration-coverage.outputs.total-coverage }}%',
                color: '${{ steps.integration-coverage.outputs.badge-color }}',
              },
            ];

            for (const badge of badges) {
              let sha;
              try {
                ({ data: { sha } } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: badge.path,
                  ref: 'main',
                }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: badge.path,
                message: `Update ${badge.label} badge`,
                content: Buffer.from(JSON.stringify({
                  schemaVersion: 1,
                  label: badge.label,
                  message: badge.message,
                  color: badge.color,
                })).toString('base64'),
                branch: 'main',
                sha,
              });
            }
